[package]
# ADR 0013 / 0014：身份 kmp_wgpu_native（故意 ABI break，无 holm_runtime 兼容）。
name = "kmp_wgpu_native"
version = "0.0.1"
edition = "2021"
description = "kmp_wgpu_native (ADR 0013) · wgpu primitives + Holm fullscreen Present"
license = "MIT"
publish = false

[lib]
crate-type = ["cdylib", "rlib", "staticlib"]
name = "kmp_wgpu_native"

[features]
default = ["wgpu_backend"]
wgpu_backend = []

[dependencies]
bytemuck = { version = "1", features = ["derive"] }
# 与 wgpu 30 对齐；同步 WGSL 语法校验（不跑 naga 后端）
naga = { version = "30.0.2", default-features = false, features = ["wgsl-in"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wgpu = { version = "30.0.2", default-features = false, features = ["wgsl", "webgpu", "webgl"] }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
console_error_panic_hook = "0.1"
web-sys = { version = "0.3", features = ["HtmlCanvasElement", "OffscreenCanvas", "Window", "Document", "console"] }

[target.'cfg(target_os = "android")'.dependencies]
# wgpu 30：显式 vulkan + gles，匹配 JNI Backends::VULKAN | GL
wgpu = { version = "30.0.2", default-features = false, features = ["wgsl", "vulkan", "gles"] }
jni = "0.21"
ndk-sys = "0.6"
raw-window-handle = "0.6"
pollster = "0.4"

[target.'cfg(target_os = "ios")'.dependencies]
# ADR 0009：Metal + C Session；勿静默换非 wgpu
wgpu = { version = "30.0.2", default-features = false, features = ["wgsl", "metal"] }
pollster = "0.4"

# ADR 0010：Ohos 报 target_os=linux + target_env=ohos。
# wgpu-hal 30 Vulkan create_surface 尚无 OhosNdk 分支；GLES/EGL 已支持 OhosNdk → 显式 vulkan+gles，创建时 Vulkan 失败则走 GL。
[target.'cfg(target_env = "ohos")'.dependencies]
wgpu = { version = "30.0.2", default-features = false, features = ["wgsl", "vulkan", "gles"] }
raw-window-handle = "0.6"
pollster = "0.4"

# 包体瘦身（Android .so / wasm / xcframework 共用）
[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
